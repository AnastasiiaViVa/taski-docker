# Volumes для данных PostgreSQL и общей статики
volumes:
  pg_data_production:
  static_volume:

# Контейнеры production-версии проекта
services:
  # База данных PostgreSQL
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data

  # Django + Gunicorn из Docker Hub
  backend:
    image: anaviva/taski_backend:latest
    env_file: .env
    volumes:
      - static_volume:/backend_static

  # Фронтенд из Docker Hub
  frontend:
    image: anaviva/taski_frontend:latest
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static

  # Nginx из Docker Hub
  gateway:
    image: anaviva/taski_gateway:latest
    env_file: .env
    volumes:
      - static_volume:/staticfiles/
    ports:
      - 8000:80
