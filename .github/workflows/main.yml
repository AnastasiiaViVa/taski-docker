# Название workflow в GitHub Actions
name: Main Taski workflow

# Запускаем workflow при push в ветку main
on:
  push:
    branches:
      - main

jobs:
  tests:
    # Временный сервер GitHub Actions с Ubuntu
    runs-on: ubuntu-latest

    steps:
      # Копируем код репозитория на раннер
      - name: Check out code
        uses: actions/checkout@v3

      # Устанавливаем Python 3.12
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      # Обновляем pip и устанавливаем линтеры
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install flake8==7.3.0 flake8-isort==7.0.0

      # Проверяем Python-код бэкенда
      - name: Test with flake8
        run: python -m flake8 backend/
